buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        REACT_NATIVE_NODE_MODULES_DIR = "$rootDir/../node_modules/react-native"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.5.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        // sometimes jitpack may be needed:
        maven { url 'https://www.jitpack.io' }
    }
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                if (compileSdkVersion == null) {
                    compileSdkVersion rootProject.ext.compileSdkVersion
                }
                
                // Fix for missing <format> include in React Native 0.81.5 headers
                defaultConfig.externalNativeBuild.cmake {
                    if (cppFlags instanceof List) {
                        cppFlags.add("-include format")
                        cppFlags.add("-D_LIBCPP_HAS_NO_INCOMPLETE_FORMAT=0")
                    } else {
                        cppFlags = (cppFlags ?: "") + " -include format -D_LIBCPP_HAS_NO_INCOMPLETE_FORMAT=0"
                    }
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
